services:
  mysql:
    image: mysql:8.0

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sakila

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d

    ports:
      - "3306:3306"

  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: aluno
      MYSQL_PASSWORD: aluno
      MYSQL_DATABASE: sakila

    depends_on:
      - mysql

volumes:
  mysql_data:
