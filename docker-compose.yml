services:
  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sakila

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    image: sql-prof-davi

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: aluno
      MYSQL_PASSWORD: aluno
      MYSQL_DATABASE: sakila

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
