<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professor Davi's SQL Tool</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="main-wrapper">
      <div class="main-container">
        <header class="topbar">
          <div class="topbar-left">Professor Davi's SQL Tool</div>

          <div class="topbar-center">
            <button id="contrastBtn" class="top-btn">
              <i class="bi bi-brightness-high"></i>
              Contraste
            </button>

            <button id="decreaseFontBtn" class="top-link">A-</button>

            <button id="increaseFontBtn" class="top-link">A+</button>
          </div>

          <div class="topbar-right">
            <a
              href="https://davimagals.github.io/computer-teaching/disciplines/database/lessons/Sakila/sakila-er-original.png"
              target="_blank"
            >
              <i class="bi bi-diagram-2"></i>
              Original ER
            </a>
            <a
              href="https://davimagals.github.io/computer-teaching/disciplines/database/lessons/Sakila/sakila-er-traduzido.png"
              target="_blank"
            >
              <i class="bi bi-diagram-2"></i>
              Translated ER
            </a>
          </div>
        </header>

        <main class="content-area">
          <div class="editor-panel">
            <div class="editor-header">
              <button id="clearBtn" class="clear-btn">
                <i class="bi bi-trash"></i>
                Clear
              </button>
            </div>

            <label for="sqlCode" class="form-label">SQL code:</label>

            <textarea
              id="sqlCode"
              class="form-control sql-textarea"
              spellcheck="false"
              rows="9"
              placeholder="SELECT * FROM actor;"
            ></textarea>

            <button id="runBtn" class="run-btn">Run SQL code</button>
          </div>

          <div class="result-panel">
            <label class="form-label">SQL result:</label>

            <div id="resultBox" class="result-box">
              <div id="spinner" class="spinner-area d-none">
                <div class="spinner-border text-primary"></div>
              </div>

              <div id="resultContent">Waiting SQL execution...</div>
            </div>
          </div>
        </main>

        <footer class="footer">
          Created by
          <a
            href="https://davimagals.github.io/"
            target="_blank"
            class="link-secondary"
            >Professor Davi</a
          >, inspired by the SQLizer tool.
        </footer>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
